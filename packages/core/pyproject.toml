[project]
name = "admissible-core"
version = "0.8.1"
description = "The authority-neutral Admissible kernel: identity, policy, evidence, decision, schemas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roque Briceño" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["admission-control", "evidence", "policy", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

# No `[project.scripts]`, and no `dependencies`, on purpose.
#
# Core is the floor Ready, Trust and the compatibility umbrella stand on. A
# floor with dependencies of its own is a floor that can pull the split back
# together -- one conditional requirement is enough to make `pip install
# admissible-ready` also install the signing distribution -- so the list is
# empty rather than short. And a library that installs a console command is a
# program: the commands belong to the distributions that carry an authority.

[project.urls]
Documentation = "https://github.com/prive-hn/admissible#readme"
Issues = "https://github.com/prive-hn/admissible/issues"
Repository = "https://github.com/prive-hn/admissible"

[build-system]
# The backend is pinned exactly because release artifacts record generator
# identity and must not depend on resolver time.
requires = ["setuptools==83.0.0"]
# setuptools, wrapped by an in-tree backend that stages the root-owned research
# and schema sources into `_staged/` before each hook and removes them after.
# `build_backend.py` says why at length; the short version is that a
# `package-dir` pointing outside the project builds a correct wheel, an sdist
# that is missing four packages, and four stray directories in the working
# tree.
build-backend = "build_backend"
backend-path = ["."]

[tool.setuptools]
# Enumerated, never discovered. `packages.find` walks the project directory,
# and the roots below are not in it; more importantly an equality is the thing
# worth asserting, because a wheel that ships one namespace more than its
# authority needs is a wheel whose authority is not what it claims.
#
# `atlas.tests` is absent by construction: it is not listed, so it is not
# packaged. It imports the top-level `tests` package, which no distribution
# ships, and an installed `atlas.tests` would be an import error waiting in
# the one place it cannot be fixed.
packages = ["admissible_core", "fcd", "rga", "atlas", "protocol"]

[tool.setuptools.package-dir]
# `fcd`, `rga`, `atlas` and `protocol` are research and schema sources owned by
# the repository root. `_staged/` is where the build backend puts a transient,
# byte-identical copy of them; it exists only while a build is running and is
# never committed. Nothing in the tree ever holds a second permanent file with
# the same dotted module name, which is what the import census forbids -- two
# `fcd.journal` files are two canonical_json implementations, with import order
# deciding which one hashes a receipt.
admissible_core = "src/admissible_core"
fcd = "_staged/fcd"
rga = "_staged/rga"
atlas = "_staged/atlas"
protocol = "_staged/protocol"

[tool.setuptools.package-data]
# The JSON Schema documents are the wire contract. They ship from `protocol/`,
# once, with their source bytes; `admissible_core.schema` reads them back
# through `importlib.resources`, so a wheel without them is a wheel whose
# schema loader raises.
protocol = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]
