# Admissible gate for this repository.
#
# The whole executable boundary is one commit, and it is written twice below.
# `uses: ...@SHA` pins the workflow; `tool-sha: SHA` pins the program that
# workflow runs. They must be the same commit -- the gate compares them at run
# time and refuses if they disagree -- because a workflow pinned by commit that
# then checks its own tool out of a movable tag has pinned nothing that matters.
#
# This gate evaluates. It never signs, it takes no secret, and a green run means
# "the deterministic checks passed for this commit" and nothing more. Issuing a
# receipt happens outside GitHub Actions, in a trust domain the candidate's
# commands cannot reach:
#
#   1. fetch the finished run's `admissible-preview-FULL_SHA-attempt-N`
#      artifact and verify its included `preview.sha256` receipt;
#   2. an external observer validates provider and isolation evidence, then
#      signs with `admissible attest-evaluation --preview preview.json
#      --source-receipt source.json --isolation MODE --out evaluation.json`;
#   3. on the trusted finalizer, select durable state before either operation:
#
#        export ADMISSIBLE_HOME=/var/lib/admissible
#        export ADMISSIBLE_DURABLE_HOME=1
#        admissible policy trust --repo /trusted/checkout
#        admissible finalize --preview preview.json --sha "$SHA" \
#          --policy-root /trusted/checkout \
#          --evaluation-attestation evaluation.json \
#          --reviews /trusted/out-of-band/reviews.json
#
#      `--reviews` carries separately signed review and authorship claims.
#      Those are separate authenticated roles; adding them needs no observer
#      re-sign because the finalizer authenticates and binds them independently.
#
# Neither step belongs in a workflow file, so neither is here.
name: admissible

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    # Both of these are the same commit. Replace both together, with the exact
    # sha of the Admissible release you reviewed -- a tag is a name its owner
    # can move, a commit is the thing you read.
    uses: prive-hn/admissible/.github/workflows/admissible-gate.yml@e9d4552a20716948f8adab5c5e474b3b6a5340c4
    with:
      tool-sha: e9d4552a20716948f8adab5c5e474b3b6a5340c4
      # config-path: .admissible.json
      # class: default
      # evaluate-runs-on: '["self-hosted","linux","x64","your-label"]'

  # TEMPORARY diagnostic (this branch only): the gate captures each check's
  # output and publishes only a digest, so a red `unit` never names the test
  # that failed. This non-gating job reproduces `make test` on the same runner
  # and prints the failing tests verbatim, so the residual can be fixed. Remove
  # before merge.
  diagnose-unit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -uo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install -q -e '.[dev]'
          id -un; umask
          set +e
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' > unit.out 2>&1
          echo "tests/ exit: $?"
          .venv/bin/python -m unittest discover -s atlas/tests -p 'test_*.py' > atlas.out 2>&1
          echo "atlas exit: $?"
          set -e
          echo "===== FAIL/ERROR names (tests/) ====="
          grep -E '^(FAIL|ERROR):' unit.out | sed -E 's/ \(.*//' | sort | uniq -c || true
          echo "===== grouped by module (tests/) ====="
          grep -E '^(FAIL|ERROR):' unit.out | grep -oE '\(([a-zA-Z0-9_.]+)\.[A-Za-z0-9_]+\.' | sed -E 's/\(([a-zA-Z0-9_.]+)\.[A-Za-z0-9_]+\./\1/' | sort | uniq -c | sort -rn || true
          echo "===== summary lines ====="
          grep -E '^Ran |^OK|^FAILED' unit.out atlas.out || true
          echo "===== first 120 lines of failure detail (tests/) ====="
          awk '/^={70}/{p=1} p' unit.out | head -120 || true
