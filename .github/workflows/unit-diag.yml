name: unit-diag
on: [push]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci --prefix apps/cockpit
      - run: env -u GITHUB_REPOSITORY -u GITHUB_ACTIONS make test > /tmp/mkt.log 2>&1; echo "exit=$?"; tail -60 /tmp/mkt.log
