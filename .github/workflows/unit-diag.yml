name: unit-diag
on: [push]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: make paper
      - name: commit rebuilt paper
        run: |
          git config user.name "prive-ci-bot"
          git config user.email "ci@priveperfumeshn.com"
          git add paper/ || true
          if git diff --cached --quiet; then echo "no paper changes"; else
            git commit -m "Rebuild paper artifacts on the canonical hosted build environment (linux, py3.12)"
            git push
          fi
      - name: scrubbed make test
        run: |
          set +e
          env -u GITHUB_REPOSITORY -u GITHUB_ACTIONS -u GITHUB_REF -u GITHUB_SHA -u GITHUB_EVENT_NAME -u GITHUB_WORKSPACE -u RUNNER_TEMP -u CI make test > /tmp/mkt.log 2>&1
          rc=$?
          echo "make-exit=$rc"
          grep -E '^(OK|FAILED|Ran )' /tmp/mkt.log | tail -4
          grep -E '^(FAIL|ERROR):' /tmp/mkt.log | head -10
          exit 0
